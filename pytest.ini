[pytest]
testpaths = tests
# Put the repo root on sys.path so tests can `import app...` and `import scripts...`.
pythonpath = .
addopts = -ra --strict-markers
markers =
    slow: loads the real models and needs the ingested database (still part of `make test`)
# PyMuPDF's SWIG-generated bindings trigger these on import (harmless, upstream issue).
filterwarnings =
    ignore:builtin type Swig:DeprecationWarning
    ignore:builtin type swigvarlink:DeprecationWarning
